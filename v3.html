*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#173245;background:#dcebf4}body{background-image:radial-gradient(circle at 20px 20px,#fff9 1.5px,transparent 1.6px);background-size:44px 44px}.top{position:sticky;top:0;z-index:50;height:64px;background:#5586a6;color:#fff;box-shadow:0 2px 10px #1233}.topin{max-width:760px;height:100%;margin:auto;display:flex;align-items:center;gap:12px;padding:0 14px}.back{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff2;color:#fff;font-weight:800}.headtxt{min-width:0;flex:1}.headtxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.headtxt small{opacity:.8}.iconbtn{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer;padding:8px}.wrap{width:min(720px,100%);margin:0 auto;padding:14px 12px 90px}.notice{background:#fff;border-radius:15px;padding:12px 14px;text-align:center;font-size:12px;color:#718695;box-shadow:0 1px 2px #0001;margin-bottom:12px}.toc{background:#fff;border-radius:16px;box-shadow:0 1px 3px #0002;margin-bottom:14px;overflow:hidden}.tocHead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}.tocHead strong{font-size:14px}.tocHead small{color:#8294a1}.tocBody{max-height:360px;overflow:auto;border-top:1px solid #edf2f5;padding:7px}.tocBody.hidden{display:none}.tocSection{font-size:11px;font-weight:800;color:#6a7d8a;background:#f2f6f8;border-radius:8px;padding:7px 9px;margin:5px}.tocItem{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;cursor:pointer;font-size:12px}.tocItem:hover,.tocItem.active{background:#e6f3fb}.tocNum{width:28px;height:28px;border-radius:9px;background:#eef4f7;display:grid;place-items:center;font-weight:800;color:#50758c}.tocItem.active .tocNum{background:#5586a6;color:#fff}.sectionPill{width:max-content;max-width:90%;margin:10px auto;background:#718fa1;color:#fff;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700}.post{position:relative;background:#fff;border-radius:15px;margin:8px 0 12px;padding:12px 12px 9px;box-shadow:0 1px 2px #0002;overflow:hidden}.post::before{content:"";position:absolute;left:-9px;top:18px;border:10px solid transparent;border-right-color:#fff}.channel{font-size:11px;color:#5684a2;font-weight:800;margin-bottom:4px}.title{font-size:14px;font-weight:800;color:#152c3a;margin:0 0 5px}.text{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#263b48}.text a{color:#168bd2;text-decoration:none}.text.collapsed{max-height:230px;overflow:hidden;position:relative}.text.collapsed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:65px;background:linear-gradient(transparent,#fff)}.more{border:0;background:transparent;color:#168bd2;font-weight:700;font-size:12px;padding:6px 0;cursor:pointer}.album{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;border-radius:12px;overflow:hidden;margin:9px -4px 7px;background:#d5e0e6}.tile{position:relative;min-height:160px;background:#cad9e2;overflow:hidden;cursor:pointer}.tile.wide{grid-column:1/-1}.tile img,.tile video{width:100%;height:100%;min-height:160px;max-height:460px;object-fit:cover;display:block}.tile .poster{width:100%;height:100%;min-height:180px;background:#1e2e38;display:grid;place-items:center;color:#fff;font-size:38px}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#0008;color:#fff;display:grid;place-items:center;font-size:23px;border:2px solid #fff9}.caption{position:absolute;left:7px;right:7px;bottom:7px;padding:5px 7px;border-radius:7px;background:#0008;color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.docs{display:grid;gap:7px;margin-top:8px}.doc{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid #e4edf2;border-radius:11px;text-decoration:none;color:#31566d;background:#f8fbfc}.doc b{font-size:12px;display:block}.doc small{font-size:10px;color:#82929d}.meta{display:flex;justify-content:flex-end;gap:5px;align-items:center;color:#91a0aa;font-size:10px;margin-top:7px}.checks{color:#29a6dd;font-size:12px}.searchBox{position:fixed;top:70px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));z-index:60;background:#fff;border-radius:13px;padding:8px;box-shadow:0 10px 30px #0003;display:none}.searchBox.show{display:flex}.searchBox input{border:0;outline:none;width:100%;font-size:14px;padding:8px}.latest{position:fixed;right:max(16px,calc((100% - 760px)/2 + 8px));bottom:26px;width:46px;height:46px;border:0;border-radius:50%;background:#607f91;color:#fff;box-shadow:0 6px 20px #0004;cursor:pointer;font-size:20px;z-index:45}.state{max-width:460px;margin:18vh auto;background:#fff;padding:24px;border-radius:18px;text-align:center;box-shadow:0 14px 45px #3c647b33}.state h2{font-size:17px;margin:8px 0}.state p{font-size:12px;color:#718491;line-height:1.55}.state a,.state button{display:inline-block;border:0;border-radius:11px;background:#5586a6;color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:11px 16px;cursor:pointer;margin:4px}.state .secondary{background:#edf4f7;color:#45687d}.viewer{position:fixed;inset:0;background:#07131bea;z-index:100;display:none;align-items:center;justify-content:center}.viewer.show{display:flex}.viewerInner{width:100%;height:100%;display:grid;place-items:center;padding:52px 54px}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer iframe{width:min(1000px,95vw);height:min(70vh,700px);border:0;background:#000}.viewerClose,.viewerPrev,.viewerNext{position:absolute;border:0;background:#0008;color:#fff;border-radius:50%;cursor:pointer}.viewerClose{top:15px;right:15px;width:42px;height:42px;font-size:22px}.viewerPrev,.viewerNext{top:50%;width:44px;height:44px;font-size:25px}.viewerPrev{left:12px}.viewerNext{right:12px}.viewerCount{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:#0007;border-radius:999px;padding:6px 10px}@media(max-width:620px){.wrap{padding-left:7px;padding-right:7px}.post{margin-left:28px}.tile{min-height:125px}.tile img{min-height:125px}.viewerInner{padding:55px 12px}.viewerPrev{left:6px}.viewerNext{right:6px}}

<body>
<header class="top"><div class="topin"><button class="back" onclick="location.href='https://www.yeunauan.live/my-courses'">‹</button><div class="avatar">V3</div><div class="headtxt"><b id="headTitle">Telegram Channel LMS</b><small id="headSub">Đang xác thực…</small></div><button class="iconbtn" id="searchBtn">⌕</button><button class="iconbtn" id="tocBtn">☰</button></div></header>
<div class="searchBox" id="searchBox"><input id="searchInput" placeholder="Tìm trong khóa học…" /><button class="iconbtn" style="color:#55798e" id="closeSearch">✕</button></div>
<main class="wrap" id="app"><div class="state"><div style="font-size:40px">🔐</div><h2>Đang xác thực lớp học</h2><p>V3 sử dụng cùng phiên học viên và cơ chế chống chia sẻ tài khoản của hệ thống hiện tại.</p></div></main>

<script>
const LMS_DEVICE_KEY="lms_device_id",LMS_SESSION_KEY="lms_verified_session_id",LMS_SESSION_ALIAS_KEY="lms_session_id",SESSION_COOKIE="course_session_token";
let COURSE=new URLSearchParams(location.search).get("course")||"",DATA=null,viewerItems=[],viewerIndex=0,observer=null;
const app=document.getElementById("app");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')}
function genId(prefix){const a=new Uint8Array(18);crypto.getRandomValues(a);return prefix+"_"+[...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
function deviceId(){let v="";try{v=localStorage.getItem(LMS_DEVICE_KEY)||"";if(!v){v=genId("lmsdev");localStorage.setItem(LMS_DEVICE_KEY,v)}}catch{v=genId("lmsdev")}return v}
function sessionHeaders(){try{const s=localStorage.getItem(LMS_SESSION_KEY)||localStorage.getItem(LMS_SESSION_ALIAS_KEY)||"",d=localStorage.getItem(LMS_DEVICE_KEY)||"";return s&&d?{"X-LMS-Session-Id":s,"X-LMS-Device-Id":d}:{}}catch{return {}}}
function legacySession(course){try{return localStorage.getItem(`course_session_token_${course}`)||""}catch{return ""}}
function saveLegacy(course,d){try{if(d.sessionToken)localStorage.setItem(`course_session_token_${course}`,d.sessionToken);if(d.email)localStorage.setItem(`course_session_email_${course}`,d.email);if(d.sessionExpiresAt)localStorage.setItem(`course_session_exp_${course}`,String(d.sessionExpiresAt))}catch{}}
function entryToken(){const h=new URLSearchParams(String(location.hash||"").replace(/^#/,"")).get("entry_token");return h||new URLSearchParams(location.search).get("entry_token")||""}
function cleanEntryToken(course){const u=new URL(location.href);u.searchParams.delete("entry_token");const hp=new URLSearchParams(String(u.hash||"").replace(/^#/,""));hp.delete("entry_token");u.hash=hp.toString()?"#"+hp.toString():"";if(course)u.searchParams.set("course",course);history.replaceState({},document.title,u.toString())}
function state(icon,title,text,buttons=""){app.innerHTML=`<div class="state"><div style="font-size:40px">${icon}</div><h2>${esc(title)}</h2><p>${text}</p>${buttons}</div>`}
function protectedState(msg){state("🔒","Cần mở từ Cổng học viên",esc(msg||"Phiên học cần được xác thực từ Cổng học viên."),'<a href="https://www.yeunauan.live/my-courses">Về Khóa học của tôi</a>')}
async function verifyEntry(){const t=entryToken();if(!t)return true;state("🔐","Đang xác thực liên kết","Vui lòng chờ trong giây lát…");try{const r=await fetch("/api/lms/portal?endpoint=verify-entry-token",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({entry_token:t,lms_device_id:deviceId()})});const d=await r.json();if(!r.ok||!d.ok){state("⚠️","Liên kết lớp học không hợp lệ",esc(d.error||"Liên kết đã hết hạn hoặc đã được sử dụng."),'<a href="https://www.yeunauan.live/my-courses">Về Cổng học viên</a>');return false}COURSE=String(d.course_slug||COURSE).trim();if(d.lms_session_id){try{localStorage.setItem(LMS_SESSION_KEY,d.lms_session_id);localStorage.setItem(LMS_SESSION_ALIAS_KEY,d.lms_session_id)}catch{}}cleanEntryToken(COURSE);return true}catch{state("⚠️","Không xác thực được liên kết","Vui lòng quay lại Cổng học viên và mở lớp lại.",'<a href="https://www.yeunauan.live/my-courses">Về Cổng học viên</a>');return false}}
async function bootstrap(credential=""){const r=await fetch("/api/lms/portal?endpoint=v3-bootstrap",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json",...sessionHeaders()},body:JSON.stringify({credential})});const d=await r.json().catch(()=>({}));return {r,d}}
function chooseCourse(d){const courses=d.allowedCourses||[];if(d.verifiedSession&&d.verifiedCourse){COURSE=d.verifiedCourse;return loadCourse()}if(COURSE&&courses.some(c=>(c.slug||c)===COURSE))return loadCourse();if(courses.length===1){COURSE=courses[0].slug||courses[0];return loadCourse()}if(courses.length){state("📚","Chọn khóa học","Tài khoản của bạn có nhiều khóa đang hoạt động.",courses.map(c=>`<button class="secondary" onclick="COURSE=${JSON.stringify(c.slug||c)};loadCourse()">${esc(c.title||c.slug||c)}</button>`).join(""));return}state("⚠️","Không có khóa học","Tài khoản này chưa có khóa học đang hoạt động.")}
async function showGoogleFallback(message){state("🔑","Đăng nhập học viên",esc(message||"Chọn đúng Gmail đã được cấp khóa học."),'<div id="gbtn" style="display:flex;justify-content:center;margin:10px"></div><a class="secondary" href="https://www.yeunauan.live/my-courses">Về Cổng học viên</a>');try{const c=await fetch("/api/lms/portal?endpoint=public-config").then(r=>r.json());let n=0;while(!(window.google&&google.accounts&&google.accounts.id)&&n++<80)await new Promise(r=>setTimeout(r,100));if(!c.googleClientId||!window.google)throw 0;google.accounts.id.initialize({client_id:c.googleClientId,callback:async x=>{state("🔐","Đang kiểm tra quyền học","Vui lòng chờ…");const b=await bootstrap(x.credential);if(b.r.ok&&b.d.allowed)chooseCourse(b.d);else if(String(b.d.code||b.d.authError||"").includes("session"))protectedState(b.d.error);else showGoogleFallback(b.d.error||"Gmail này chưa được cấp khóa học.")}});google.accounts.id.renderButton(document.getElementById("gbtn"),{theme:"outline",size:"large",text:"signin_with",shape:"pill"})}catch{document.getElementById("gbtn")?.insertAdjacentHTML("afterend","<p>Không tải được Google Sign-In.</p>")}}
async function start(){if(!(await verifyEntry()))return;const b=await bootstrap();if(b.r.ok&&b.d.allowed){chooseCourse(b.d);return}const code=String(b.d.code||b.d.authError||"");if(code.includes("session")||code.includes("device")||code.includes("entry_token")||code==="protected-session-required"){protectedState(b.d.error);return}await showGoogleFallback(b.d.error)}
async function loadCourse(){if(!COURSE)return start();state("⏳","Đang tải khóa học","Đang lấy bài học và media…");try{const r=await fetch("/api/lms/portal?endpoint=course-data",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json",...sessionHeaders()},body:JSON.stringify({course:COURSE,sessionToken:legacySession(COURSE)})});const d=await r.json();if(!r.ok||!d.allowed){const code=String(d.code||d.authError||"");if(code.includes("session")||code.includes("device")||code.includes("entry_token")||code.startsWith("student_session_")){protectedState(d.error);return}state("⚠️","Không có quyền truy cập",esc(d.error||"Không tải được khóa học."),'<a href="https://www.yeunauan.live/my-courses">Về Cổng học viên</a>');return}saveLegacy(COURSE,d);DATA=d;COURSE=d.course||COURSE;render()}catch(e){state("📡","Không tải được khóa học","Máy chủ đang bận hoặc kết nối bị gián đoạn. Hãy tải lại trang.",'<button onclick="location.reload()">Tải lại</button>')}}
function driveId(u){const s=String(u||"");let m=s.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);if(m)return m[1];m=s.match(/[?&]id=([^&#]+)/);return m?m[1]:""}
function ytId(u){const s=String(u||"");let m=s.match(/youtu\.be\/([\w-]{11})/);if(m)return m[1];m=s.match(/[?&]v=([\w-]{11})|\/embed\/([\w-]{11})|\/shorts\/([\w-]{11})/);return m?(m[1]||m[2]||m[3]):""}
function imageUrl(u){const id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w1600`:String(u||"")}
function videoEmbed(u){let s=String(u||"").replace(/&amp;/g,"&");const y=ytId(s);if(y)return `https://www.youtube.com/embed/${y}?rel=0&modestbranding=1&playsinline=1`;const d=driveId(s);if(d)return `https://drive.google.com/file/d/${d}/preview`;if(s.includes("mediadelivery.net")){s=s.replace(/^https?:\/\/player\.mediadelivery\.net\//,"https://iframe.mediadelivery.net/").replace(/^(https:\/\/iframe\.mediadelivery\.net\/)play\//,"$1embed/");return s}return s}
function looksImage(u){return /\.(jpg|jpeg|png|webp|gif)(?:[?#].*)?$/i.test(String(u||""))||String(u||"").includes("drive.google.com/thumbnail")}
function combinedText(l){const a=String(l.description||"").trim(),b=String(l.recipeText||"").trim();return [a,b].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join("\n\n")}
function collectMedia(l){const out=[];const main=String(l.videoUrl||l.secureVideoUrl||"").trim();if(main){const typ=String(l.mainMediaType||"").toLowerCase();if(typ==="image"||looksImage(main))out.push({type:"image",url:imageUrl(main),title:l.title||""});else out.push({type:"video",url:main,title:l.title||""})}let parsed=[];try{parsed=window.parseMediaUrls?parseMediaUrls(l.mediaUrls):[]}catch{}for(const x of parsed){const type=String(x.type||"").toLowerCase()==="image"||looksImage(x.url)?"image":"video";out.push({type,url:type==="image"?imageUrl(x.url):x.url,title:x.title||"",caption:x.caption||""})}return out.filter((x,i,a)=>x.url&&a.findIndex(y=>y.url===x.url)===i)}
function mediaHtml(items,postId){if(!items.length)return"";return `<div class="album">${items.map((m,i)=>{const wide=items.length===1||items.length===3&&i===0?" wide":"";if(m.type==="image")return `<div class="tile${wide}" data-media-post="${postId}" data-media-index="${i}"><img src="${esc(m.url)}" loading="lazy" alt="${esc(m.title)}">${m.caption?`<div class="caption">${esc(m.caption)}</div>`:""}</div>`;return `<div class="tile${wide}" data-media-post="${postId}" data-media-index="${i}"><div class="poster">🎬</div><div class="play">▶</div>${m.title?`<div class="caption">${esc(m.title)}</div>`:""}</div>`}).join("")}</div>`}
function docsHtml(l){const docs=Array.isArray(l.materials)?l.materials:[];if(!docs.length)return"";return `<div class="docs">${docs.map(d=>`<a class="doc" href="${esc(d.url||d.downloadUrl)}" target="_blank" rel="noopener"><span>📎</span><span><b>${esc(d.name||"Tài liệu")}</b><small>${esc(d.mimeType||"Tài liệu đính kèm")}</small></span></a>`).join("")}</div>`}
function render(){const info=DATA.courseInfo||{},lessons=DATA.lessons||[];document.getElementById("headTitle").textContent=info.title||COURSE;document.getElementById("headSub").textContent=`${lessons.filter(x=>!x.isSection).length} bài đăng · ${DATA.email||""}`;let chapter="",toc=[],posts=[],postNo=0;for(const l of lessons){if(l.isSection){chapter=l.title||"Chương";posts.push(`<div class="sectionPill">${esc(chapter)}</div>`);toc.push({section:true,title:chapter});continue}postNo++;const id=`post-${esc(String(l.id||postNo))}`,text=combinedText(l),long=text.length>700||text.split("\n").length>11,media=collectMedia(l);l.__v3media=media;l.__v3post=id;posts.push(`<article class="post" id="${id}" data-title="${esc((l.title||"").toLowerCase())}" data-text="${esc(text.toLowerCase())}"><div class="channel">${esc(info.title||COURSE)}</div><h3 class="title">${esc(l.title||`Bài ${postNo}`)}</h3>${text?`<div class="text${long?" collapsed":""}">${linkify(text)}</div>${long?'<button class="more">Xem thêm</button>':""}`:""}${mediaHtml(media,id)}${docsHtml(l)}<div class="meta">Bài ${postNo} · <span>◉ ${Number(l.views||0)}</span><span class="checks">✓✓</span></div></article>`);toc.push({section:false,title:l.title||`Bài ${postNo}`,num:postNo,id})}app.innerHTML=`<div class="notice">Đây là <b>V3 Telegram Channel LMS</b>. Quyền học và phiên thiết bị vẫn do hệ thống LMS Production kiểm soát.</div><div class="toc" id="toc"><div class="tocHead"><span>🗂️</span><div><strong>Phụ lục khóa học</strong><br><small>${toc.filter(x=>x.section).length} chương · ${postNo} bài</small></div><span style="margin-left:auto">⌃</span></div><div class="tocBody" id="tocBody">${toc.map(x=>x.section?`<div class="tocSection">${esc(x.title)}</div>`:`<div class="tocItem" data-target="${x.id}"><span class="tocNum">${x.num}</span><b>${esc(x.title)}</b><span style="margin-left:auto;color:#9badb8">›</span></div>`).join("")}</div></div>${posts.join("")}`;bind();}
function bind(){document.querySelector(".tocHead")?.addEventListener("click",()=>document.getElementById("tocBody")?.classList.toggle("hidden"));document.querySelectorAll(".tocItem").forEach(x=>x.onclick=()=>document.getElementById(x.dataset.target)?.scrollIntoView({behavior:"smooth",block:"start"}));document.querySelectorAll(".more").forEach(b=>b.onclick=()=>{const t=b.previousElementSibling;t.classList.toggle("collapsed");b.textContent=t.classList.contains("collapsed")?"Xem thêm":"Thu gọn"});document.querySelectorAll("[data-media-post]").forEach(t=>t.onclick=()=>openViewer(t.dataset.mediaPost,Number(t.dataset.mediaIndex)));if(observer)observer.disconnect();observer=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){document.querySelectorAll(".tocItem").forEach(x=>x.classList.toggle("active",x.dataset.target===e.target.id))}},{rootMargin:"-25% 0px -60% 0px"});document.querySelectorAll(".post").forEach(p=>observer.observe(p))}
function lessonForPost(id){return (DATA.lessons||[]).find(l=>l.__v3post===id)}
function openViewer(postId,i){const l=lessonForPost(postId);viewerItems=l?.__v3media||[];viewerIndex=i||0;paintViewer();document.getElementById("viewer").classList.add("show")}
function paintViewer(){const m=viewerItems[viewerIndex];if(!m)return;document.getElementById("viewerCount").textContent=`${viewerIndex+1} / ${viewerItems.length}`;const box=document.getElementById("viewerInner");box.innerHTML=m.type==="image"?`<img src="${esc(m.url)}">`:`<iframe src="${esc(videoEmbed(m.url))}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>`}
function closeViewer(){document.getElementById("viewer").classList.remove("show");document.getElementById("viewerInner").innerHTML=""}
document.getElementById("viewerClose").onclick=closeViewer;document.getElementById("viewerPrev").onclick=()=>{if(viewerItems.length){viewerIndex=(viewerIndex-1+viewerItems.length)%viewerItems.length;paintViewer()}};document.getElementById("viewerNext").onclick=()=>{if(viewerItems.length){viewerIndex=(viewerIndex+1)%viewerItems.length;paintViewer()}};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();if(document.getElementById("viewer").classList.contains("show")&&e.key==="ArrowRight")document.getElementById("viewerNext").click();if(document.getElementById("viewer").classList.contains("show")&&e.key==="ArrowLeft")document.getElementById("viewerPrev").click()});
document.getElementById("searchBtn").onclick=()=>{document.getElementById("searchBox").classList.add("show");document.getElementById("searchInput").focus()};document.getElementById("closeSearch").onclick=()=>document.getElementById("searchBox").classList.remove("show");document.getElementById("searchInput").oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".post").forEach(p=>p.style.display=!q||p.dataset.title.includes(q)||p.dataset.text.includes(q)?"":"none")};document.getElementById("tocBtn").onclick=()=>document.getElementById("toc")?.scrollIntoView({behavior:"smooth"});document.getElementById("latestBtn").onclick=()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
document.addEventListener("contextmenu",e=>{if(!["INPUT","TEXTAREA"].includes(e.target.tagName))e.preventDefault()});document.addEventListener("copy",e=>e.preventDefault());
start();
</script>
</body>
</html>
